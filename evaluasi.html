<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLSV | Latihan Soal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Urbanist','Segoe UI',sans-serif;}
body{
    height:100vh; overflow:hidden; color:#1e2937;
    background:linear-gradient(rgba(255,255,255,.93),rgba(240,249,255,.93)),url('assets/images/bgkubika4.png');
    background-size:cover; background-position:center; background-repeat:no-repeat; background-color:#f0f9ff;
}
.container{width:95%;max-width:1200px;height:95vh;margin:auto;padding:15px 0;display:flex;gap:15px;}

.sidebar{width:250px;background:#fff;border-radius:18px;border:1px solid #e2e8f0;box-shadow:0 6px 20px rgba(15,23,42,.06);padding:15px;overflow:auto;}
.sidebar-header{background:#7dd3fc;color:#0c4a6e;text-align:center;padding:12px;border-radius:12px;font-weight:700;margin-bottom:15px;}
.stats{display:flex;justify-content:space-between;margin-bottom:15px;}
.stat{text-align:center;}
.stat-number{font-size:22px;font-weight:700;color:#0369a1;}
.stat-label{font-size:12px;color:#64748b;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.num{height:50px;border-radius:10px;background:#f8fafc;border:1px solid #e2e8f0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;font-weight:600;transition:.3s;}
.num:hover{background:#f0f9ff;border-color:#38bdf8;}
.num.active{background:#7dd3fc;color:#0c4a6e;border-color:#38bdf8;}
.num.done{background:#14b8a6;color:#fff;border-color:#14b8a6;}

.main{flex:1;background:#fff;border-radius:18px;border:1px solid #e2e8f0;box-shadow:0 6px 20px rgba(15,23,42,.06);padding:20px;display:flex;flex-direction:column;overflow:auto;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;gap:10px;flex-wrap:wrap;}
.badge{background:#f8fafc;border:1px solid #e2e8f0;padding:8px 15px;border-radius:25px;font-size:14px;}
.dashboard-btn{text-decoration:none;background:#7dd3fc;color:#0c4a6e;padding:8px 15px;border-radius:25px;font-size:14px;font-weight:600;transition:.3s;}
.dashboard-btn:hover{background:#38bdf8;transform:translateY(-2px);}

.progress{height:8px;background:#f1f5f9;border-radius:50px;overflow:hidden;margin-bottom:16px;}
.progress-bar{width:10%;height:100%;background:#7dd3fc;transition:.4s;}

.question{font-size:20px;font-weight:600;margin-bottom:16px;line-height:1.55;}
.btn{width:100%;padding:12px 15px;margin-bottom:8px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;color:#1e2937;text-align:left;font-size:15px;cursor:pointer;transition:.3s;}
.btn:hover{background:#f0f9ff;border-color:#38bdf8;}
.btn.selected{background:#7dd3fc;border-color:#38bdf8;color:#0c4a6e;font-weight:700;}
.btn:focus-visible,.back:focus-visible,.next:focus-visible{outline:3px solid #0369a1;outline-offset:2px;}

.footer{margin-top:auto;padding-top:14px;display:flex;justify-content:space-between;}
.back{padding:10px 20px;border:1px solid #e2e8f0;border-radius:25px;background:#fff;color:#64748b;cursor:pointer;font:inherit;}
.back:hover{border-color:#38bdf8;color:#0369a1;}
.next{padding:10px 20px;border:none;border-radius:25px;background:#7dd3fc;color:#0c4a6e;cursor:pointer;font:inherit;font-weight:600;}
.next:hover{background:#38bdf8;}

/* Hasil */
.skor-besar{font-size:44px;font-weight:800;color:#0369a1;}
.review{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:10px;background:#f8fafc;}
.review.benar{border-left:5px solid #14b8a6;}
.review.salah{border-left:5px solid #ef4444;}
.review p{line-height:1.55;margin-top:6px;}

/* Penjelasan jawaban */
.review details{margin-top:10px}
.review summary{cursor:pointer;font-weight:700;color:#0369a1}
.jelas{margin-top:10px;padding:12px 14px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;font-size:15px}
.jelas p{margin:0 0 8px}
.jelas p.ok{color:#0f766e}
.jelas p.no{color:#b91c1c}
.jelas ol{margin:0 0 10px 20px;line-height:1.6}
.jelas p.kunci{margin:0;padding:8px 12px;background:#ecfdf5;border-radius:8px;color:#065f46}

@media(max-width:900px){
    body{overflow:auto;height:auto;}
    .container{flex-direction:column;height:auto;}
    .sidebar{width:100%;}
    .main{overflow:visible;}
}
</style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <div class="sidebar-header">📋 Daftar Soal</div>
        <div class="stats">
            <div class="stat"><div class="stat-number" id="selesai">0</div><div class="stat-label">Terjawab</div></div>
            <div class="stat"><div class="stat-number" id="pengerjaan">1</div><div class="stat-label">Pengerjaan</div></div>
            <div class="stat"><div class="stat-number">10</div><div class="stat-label">Total</div></div>
        </div>
        <div class="grid" id="grid"></div>
    </div>

    <div class="main" id="main">
        <div class="topbar">
            <div style="display:flex;gap:10px;align-items:center;">
                <a href="index.html" class="dashboard-btn">Kembali</a>
            </div>
            <div class="badge" id="badge">Soal 1/10</div>
        </div>

        <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
        <div class="question" id="q">Memuat...</div>
        <div id="opsi"></div>

        <div class="footer">
            <button class="back" onclick="prev()">← Sebelumnya</button>
            <button class="next" id="btnNext" onclick="next()">Lanjut →</button>
        </div>
    </div>
</div>

const BANK = RAW.trim().split('\n').map(line => {
    const p = line.split('|');

    let q = p[1];
    if (jenis === 'P') q = 'Penyelesaian dari persamaan ' + p[1] + ' adalah ...';

/* ===== PENGACAKAN =====
   - 10 soal diambil acak dari 300 soal setiap halaman dibuka.
   - Soal yang sudah pernah muncul untuk siswa yang sama (di perangkat ini)
     tidak dipilih lagi sampai seluruh bank habis terpakai, lalu diulang dari awal.
   - Urutan pilihan jawaban juga diacak. */
const JUMLAH = 10;

function randInt(n){
    if (window.crypto && crypto.getRandomValues) {
        const a = new Uint32Array(1);
        crypto.getRandomValues(a);
        return a[0] % n;
    }
    return Math.floor(Math.random() * n);
}
function acak(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = randInt(i + 1);
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function kunciSeen(){
    let nama = '';
    try { nama = (localStorage.getItem('userName') || '').trim().toLowerCase(); } catch(e){}
    return 'plsv_seen_' + nama;
}
function bacaSeen(){
    try { return JSON.parse(localStorage.getItem(kunciSeen()) || '[]'); } catch(e){ return []; }
}
function simpanSeen(arr){
    try { localStorage.setItem(kunciSeen(), JSON.stringify(arr)); } catch(e){}
}

function pilihSoal(){
    let seen = bacaSeen().filter(i => Number.isInteger(i) && i >= 0 && i < BANK.length);
    let sisa = [];
    for (let i = 0; i < BANK.length; i++) if (seen.indexOf(i) === -1) sisa.push(i);
    if (sisa.length < JUMLAH) { seen = []; sisa = BANK.map((_, i) => i); }
    const terpilih = acak(sisa).slice(0, JUMLAH);
    simpanSeen(seen.concat(terpilih));
    return terpilih;
}

function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ===== PENJELASAN JAWABAN ===== */
const MIN = '−';
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const Fr = (n, d) => { d = d === undefined ? 1 : d; if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; return [n / g, d / g]; };
const fAdd = (x, y) => Fr(x[0] * y[1] + y[0] * x[1], x[1] * y[1]);
const fMul = (x, y) => Fr(x[0] * y[0], x[1] * y[1]);
const fDiv = (x, y) => Fr(x[0] * y[1], x[1] * y[0]);
const fStr = f => (f[0] < 0 ? MIN : '') + Math.abs(f[0]) + (f[1] === 1 ? '' : '/' + f[1]);
const nm = n => (n < 0 ? MIN : '') + Math.abs(n);
const rp = n => 'Rp' + n.toLocaleString('id-ID');
const ev = (p, x) => fAdd(fMul(p.a, x), p.b);
const tx = c => (Math.abs(c) === 1 ? '' : Math.abs(c)) + 'x';
function sd(a, b) {
    let s = a ? (a < 0 ? MIN : '') + tx(a) : '';
    if (b) s += s ? (b < 0 ? ' − ' : ' + ') + Math.abs(b) : nm(b);
    return s || '0';
}

/* Pembaca ekspresi linear dalam x (mendukung kurung dan pecahan) */
function ps(s) {
    s = s.replace(/−/g, '-').replace(/×/g, '*').replace(/\s+/g, '');
    let i = 0;
    const Z = [0, 1];
    const P = (a, b) => ({ a: a, b: b });
    const add = (p, q) => P(fAdd(p.a, q.a), fAdd(p.b, q.b));
    const neg = p => P(fMul(p.a, [-1, 1]), fMul(p.b, [-1, 1]));
    const mul = (p, q) => p.a[0] ? P(fMul(p.a, q.b), fMul(p.b, q.b)) : P(fMul(q.a, p.b), fMul(q.b, p.b));
    const div = (p, q) => P(fDiv(p.a, q.b), fDiv(p.b, q.b));
    function ex() { let r = te(); while (s[i] === '+' || s[i] === '-') { const o = s[i++]; const t = te(); r = add(r, o === '-' ? neg(t) : t); } return r; }
    function te() {
        let r = fa();
        for (;;) {
            const c = s[i];
            if (c === '*') { i++; r = mul(r, fa()); }
            else if (c === '/') { i++; r = div(r, fa()); }
            else if (c === 'x' || c === '(') { r = mul(r, fa()); }
            else break;
        }
        return r;
    }
    function fa() {
        const c = s[i];
        if (c === '-') { i++; return neg(fa()); }
        if (c === '(') { i++; const r = ex(); i++; return r; }
        if (c === 'x') { i++; return P([1, 1], Z); }
        const m = /^\d+/.exec(s.slice(i)); i += m[0].length;
        return P(Z, [+m[0], 1]);
    }
    return ex();
}

/* Langkah penyelesaian satu persamaan */
function langkahPers(str) {
    const lr = str.split('=').map(ps), l = lr[0], r = lr[1];
    let m = 1;
    [l.a, l.b, r.a, r.b].forEach(f => { m = m * f[1] / gcd(m, f[1]); });
    const v = [l.a, l.b, r.a, r.b].map(f => fMul(f, [m, 1])[0]);
    const a1 = v[0], b1 = v[1], a2 = v[2], b2 = v[3];
    const L = [];
    const bentuk = sd(a1, b1) + ' = ' + sd(a2, b2);
    if (m > 1) L.push('Hilangkan pecahan: kalikan kedua ruas dengan ' + m + ' sehingga ' + bentuk + '.');
    else if (str.replace(/\s/g, '') !== bentuk.replace(/\s/g, '')) L.push('Tulis ulang dan sederhanakan kedua ruas (buka kurung kalau ada): ' + bentuk + '.');
    const A = a1 - a2, B = b2 - b1;
    if (A === 0) { L.push('Suku x habis, jadi persamaan ini tidak punya satu penyelesaian.'); return { L: L, x: null }; }
    if (a2 !== 0 || b1 !== 0) {
        L.push('Kumpulkan suku x di ruas kiri dan angka di ruas kanan: ' +
            sd(a1, 0) + (a2 ? (a2 > 0 ? ' − ' : ' + ') + tx(a2) : '') + ' = ' +
            nm(b2) + (b1 ? (b1 > 0 ? ' − ' : ' + ') + Math.abs(b1) : '') +
            ', yaitu ' + sd(A, 0) + ' = ' + nm(B) + '.');
    }
    const x = Fr(B, A);
    if (A !== 1) L.push('Bagi kedua ruas dengan ' + nm(A) + ': x = ' + fStr(x) + '.');
    else L.push('Jadi x = ' + fStr(x) + '.');
    L.push('Periksa: untuk x = ' + fStr(x) + ', ruas kiri = ' + fStr(ev(l, x)) + ' dan ruas kanan = ' + fStr(ev(r, x)) + ' (sama).');
    return { L: L, x: x };
}

function optF(t) {
    const m = /^(−|-)?(\d+)(?:\/(\d+))?$/.exec(t.trim());
    return m ? Fr((m[1] ? -1 : 1) * +m[2], m[3] ? +m[3] : 1) : null;
}

function langkahSubst(d, k) {
    return d.opsi.map((o, i) => {
        const lr = o.split('=').map(ps);
        const vl = ev(lr[0], k), vr = ev(lr[1], k);
        const sama = vl[0] === vr[0] && vl[1] === vr[1];
        return 'ABCD'[i] + '. ' + o + ' → ruas kiri = ' + fStr(vl) + ', ruas kanan = ' + fStr(vr) + (sama ? ' (sama, benar) ✓' : ' (tidak sama) ✗');
    });
}

/* Soal cerita: mengenali pola lalu menyusun penjelasannya */
function cerita(q) {
    const s = q.replace(/(\d)\.(\d{3})/g, '$1$2');
    let m;
    if ((m = s.match(/Jarak kota P dan kota Q adalah (\d+) km.*?(\d+) km\/jam.*?adalah (\d+) km/))) {
        const D = +m[1], v = +m[2], S = +m[3], t = (D - S) / v;
        return ['Misalkan lama perjalanan = x jam.', 'Jarak yang sudah ditempuh = ' + D + ' − ' + S + ' = ' + (D - S) + ' km.', 'Model: ' + v + 'x = ' + (D - S) + '.', 'x = ' + (D - S) + ' ÷ ' + v + ' = ' + t + '. Jadi lama perjalanan ' + t + ' jam.'];
    }
    if ((m = s.match(/Tabungan Rina saat ini Rp(\d+)\. Setiap minggu ia menambah tabungannya sebesar Rp(\d+)\..*?menjadi Rp(\d+)/))) {
        const S = +m[1], A = +m[2], T = +m[3], x = (T - S) / A;
        return ['Misalkan lama menabung = x minggu.', 'Model: ' + rp(S) + ' + ' + rp(A) + 'x = ' + rp(T) + '.', rp(A) + 'x = ' + rp(T) + ' − ' + rp(S) + ' = ' + rp(T - S) + '.', 'x = ' + rp(T - S) + ' ÷ ' + rp(A) + ' = ' + x + '. Jadi ' + x + ' minggu.'];
    }
    if ((m = s.match(/Panjang sebuah persegi panjang (\d+) cm lebih dari lebarnya\. Jika kelilingnya (\d+) cm/))) {
        const d = +m[1], K = +m[2], x = (K - 2 * d) / 4;
        return ['Misalkan lebar = x cm, maka panjang = (x + ' + d + ') cm.', 'Keliling = 2 × (panjang + lebar), jadi 2(x + ' + d + ' + x) = ' + K + '.', '4x + ' + (2 * d) + ' = ' + K + ', sehingga 4x = ' + (K - 2 * d) + '.', 'x = ' + (K - 2 * d) + ' ÷ 4 = ' + x + '. Jadi lebarnya ' + x + ' cm.'];
    }
    if ((m = s.match(/Budi (\d+) butir lebih banyak daripada kelereng Candra\. Jika jumlah kelereng keduanya (\d+) butir/))) {
        const d = +m[1], J = +m[2], x = (J - d) / 2;
        return ['Misalkan kelereng Candra = x, maka kelereng Budi = x + ' + d + '.', 'Jumlahnya: x + (x + ' + d + ') = ' + J + ', yaitu 2x + ' + d + ' = ' + J + '.', '2x = ' + J + ' − ' + d + ' = ' + (J - d) + '.', 'x = ' + (J - d) + ' ÷ 2 = ' + x + '. Jadi kelereng Candra ' + x + ' butir.'];
    }
    if ((m = s.match(/^(\d+) kali suatu bilangan (ditambah|dikurangi) (\d+) hasilnya (\d+)/))) {
        const k = +m[1], tam = m[2] === 'ditambah', n = +m[3], h = +m[4], r = tam ? h - n : h + n;
        return ['Misalkan bilangan itu = x.', 'Model: ' + k + 'x ' + (tam ? '+' : '−') + ' ' + n + ' = ' + h + '.', k + 'x = ' + h + (tam ? ' − ' : ' + ') + n + ' = ' + r + '.', 'x = ' + r + ' ÷ ' + k + ' = ' + (r / k) + '.'];
    }
    if ((m = s.match(/^Jumlah suatu bilangan dan (\d+) kali bilangan itu adalah (\d+)/))) {
        const k = +m[1], h = +m[2];
        return ['Misalkan bilangan itu = x.', 'Model: x + ' + k + 'x = ' + h + ', yaitu ' + (k + 1) + 'x = ' + h + '.', 'x = ' + h + ' ÷ ' + (k + 1) + ' = ' + (h / (k + 1)) + '.'];
    }
    if ((m = s.match(/Rp(\d+) ditambah Rp(\d+) untuk setiap jam.*?Rp(\d+) ditambah Rp(\d+) untuk setiap jam/))) {
        const a1 = +m[1], b1 = +m[2], a2 = +m[3], b2 = +m[4], x = (a2 - a1) / (b1 - b2);
        return ['Misalkan lama sewa = x jam.', 'Biaya A = ' + rp(a1) + ' + ' + rp(b1) + 'x, biaya B = ' + rp(a2) + ' + ' + rp(b2) + 'x.', 'Biaya sama: ' + rp(a1) + ' + ' + rp(b1) + 'x = ' + rp(a2) + ' + ' + rp(b2) + 'x.', '(' + rp(b1) + ' − ' + rp(b2) + ')x = ' + rp(a2) + ' − ' + rp(a1) + ', yaitu ' + rp(b1 - b2) + 'x = ' + rp(a2 - a1) + '.', 'x = ' + (a2 - a1) / (b1 - b2) + '. Jadi biayanya sama setelah ' + x + ' jam.'];
    }
    if ((m = s.match(/Umur seorang ayah (\d+) kali umur anaknya\. Jika jumlah umur ayah dan anaknya (\d+) tahun/))) {
        const k = +m[1], J = +m[2];
        return ['Misalkan umur anak = x, maka umur ayah = ' + k + 'x.', 'Jumlahnya: x + ' + k + 'x = ' + J + ', yaitu ' + (k + 1) + 'x = ' + J + '.', 'x = ' + J + ' ÷ ' + (k + 1) + ' = ' + (J / (k + 1)) + '. Jadi umur anak ' + (J / (k + 1)) + ' tahun.'];
    }
    if ((m = s.match(/\(x \+ (\d+)\)°, dan \(x \+ (\d+)\)°/))) {
        const p = +m[1], r = +m[2], x = (180 - p - r) / 3;
        return ['Jumlah ketiga sudut segitiga = 180°.', 'x + (x + ' + p + ') + (x + ' + r + ') = 180, yaitu 3x + ' + (p + r) + ' = 180.', '3x = 180 − ' + (p + r) + ' = ' + (180 - p - r) + '.', 'x = ' + (180 - p - r) + ' ÷ 3 = ' + x + '. Jadi x = ' + x + '°.'];
    }
    if ((m = s.match(/Rani membawa uang Rp(\d+)\. Ia membeli (\d+) buah buku tulis.*?kembalian Rp(\d+)/))) {
        const U = +m[1], n = +m[2], K = +m[3], x = (U - K) / n;
        return ['Misalkan harga satu buku tulis = x.', 'Uang yang dipakai = ' + rp(U) + ' − ' + rp(K) + ' = ' + rp(U - K) + '.', 'Model: ' + n + 'x = ' + rp(U - K) + '.', 'x = ' + rp(U - K) + ' ÷ ' + n + ' = ' + rp(x) + '.'];
    }
    if ((m = s.match(/Suhu air mula-mula (\d+)°C.*?turun (\d+)°C setiap menit.*?menjadi (\d+)°C/))) {
        const S = +m[1], d = +m[2], E = +m[3], x = (S - E) / d;
        return ['Misalkan lama pendinginan = x menit.', 'Suhu yang turun = ' + S + ' − ' + E + ' = ' + (S - E) + '°C.', 'Model: ' + d + 'x = ' + (S - E) + '.', 'x = ' + (S - E) + ' ÷ ' + d + ' = ' + x + '. Jadi ' + x + ' menit.'];
    }
    return null;
}

function ulas(d, j) {
    const q = d.q, hr = 'ABCD';
    let m, L = null, why = '';
    const kons = KONSEP.find(k => q.indexOf(k[0]) > -1);
    if (kons) {
        L = [kons[1]];
        why = 'Pilihanmu kurang tepat, lihat alasannya di bawah.';
    } else if ((m = q.match(/^(?:Penyelesaian dari persamaan|Nilai x yang memenuhi persamaan) (.+) adalah \.\.\.$/))) {
        L = ['Selesaikan persamaan ' + m[1] + ':'].concat(langkahPers(m[1]).L);
        const f = j === undefined ? null : optF(d.opsi[j]);
        if (f) {
            const lr = m[1].split('=').map(ps), vl = ev(lr[0], f), vr = ev(lr[1], f);
            why = 'Kalau x = ' + fStr(f) + ' dimasukkan ke persamaan, ruas kiri = ' + fStr(vl) + ' dan ruas kanan = ' + fStr(vr) + '. Keduanya tidak sama, jadi itu bukan penyelesaian.';
        }
    } else if ((m = q.match(/(?:penyelesaian(?:nya)?|akarnya) x = (−|-)?(\d+)/))) {
        const k = Fr((m[1] ? -1 : 1) * +m[2]);
        L = ['Masukkan x = ' + fStr(k) + ' ke setiap pilihan. Pilihan yang benar adalah yang ruas kirinya sama dengan ruas kanannya:'].concat(langkahSubst(d, k));
        why = 'Pilihanmu tidak membuat ruas kiri sama dengan ruas kanan (lihat tanda ✗ pada pilihanmu).';
    } else if ((m = q.match(/^Jika x memenuhi persamaan (.+), maka nilai dari (.+) adalah \.\.\.$/))) {
        const s = langkahPers(m[1]), v = ev(ps(m[2]), s.x);
        L = ['Cari nilai x dari ' + m[1] + ' terlebih dahulu:'].concat(s.L, ['Masukkan x = ' + fStr(s.x) + ' ke ' + m[2] + ', hasilnya ' + fStr(v) + '.']);
        why = 'Hasil perhitungan yang benar adalah ' + d.opsi[d.benar] + ', berbeda dari pilihanmu.';
    } else if ((L = cerita(q))) {
        why = 'Hasil perhitungan yang benar adalah ' + d.opsi[d.benar] + ', berbeda dari pilihanmu.';
    } else {
        L = ['Jawaban yang benar adalah ' + d.opsi[d.benar] + '.'];
    }
    const ok = j === d.benar;
    const status = ok ? 'Jawabanmu benar.' : (j === undefined ? 'Kamu belum menjawab soal ini.' : 'Jawabanmu salah. ' + why);
    return '<div class="jelas"><p class="' + (ok ? 'ok' : 'no') + '"><b>' + esc(status) + '</b></p>' +
        '<p><b>' + (ok ? 'Kenapa benar:' : 'Cara yang benar:') + '</b></p>' +
        '<ol>' + L.map(x => '<li>' + esc(x) + '</li>').join('') + '</ol>' +
        '<p class="kunci">Jawaban yang benar: <b>' + hr[d.benar] + '. ' + esc(d.opsi[d.benar]) + '</b></p></div>';
}

/* ===== STATE & TAMPILAN ===== */
let soal = [];
let idx = 0;
let jawaban = {};
let selesaiSudah = false;

function init(){
    soal = pilihSoal().map(i => {
        const b = BANK[i];
        const benarTeks = b.opsi[b.kunci];
        const opsi = acak(b.opsi);
        return { q: b.q, opsi: opsi, benar: opsi.indexOf(benarTeks) };
    });
    renderGrid();
    render();
}

function renderGrid(){
    document.getElementById('grid').innerHTML = soal.map((_, i) => {
        let cls = 'num';
        if (i === idx) cls += ' active';
        else if (jawaban[i] !== undefined) cls += ' done';
        return `<div class="${cls}" onclick="go(${i})">${i + 1}</div>`;
    }).join('');
    document.getElementById('selesai').textContent = Object.keys(jawaban).length;
    document.getElementById('pengerjaan').textContent = idx + 1;
}

function render(){
    const d = soal[idx];
    document.getElementById('q').textContent = `${idx + 1}. ${d.q}`;
    const huruf = ['A','B','C','D'];
    document.getElementById('opsi').innerHTML = d.opsi.map((o, i) => `
        <button class="btn ${jawaban[idx] === i ? 'selected' : ''}" onclick="pilih(${i})">${huruf[i]}. ${esc(o)}</button>
    `).join('');
    document.getElementById('btnNext').textContent = idx === soal.length - 1 ? 'Selesai ✓' : 'Lanjut →';
    document.getElementById('progressBar').style.width = ((idx + 1) / soal.length * 100) + '%';
    document.getElementById('badge').textContent = `Soal ${idx + 1}/${soal.length}`;
    renderGrid();
}

function pilih(i){ jawaban[idx] = i; render(); }
function go(i){ idx = i; render(); }
function prev(){ if (idx > 0) { idx--; render(); } }
function next(){
    if (idx < soal.length - 1) { idx++; render(); return; }
    const kosong = soal.length - Object.keys(jawaban).length;
    if (kosong > 0 && !confirm(`Masih ada ${kosong} soal belum dijawab. Selesaikan latihan sekarang?`)) return;
    finish();
}

function finish(){
    if (selesaiSudah) return;
    selesaiSudah = true;

    let skor = 0;
    soal.forEach((d, i) => { if (jawaban[i] === d.benar) skor++; });
    const nilai = skor * 10;
    const huruf = ['A','B','C','D'];

    const review = soal.map((d, i) => {
        const ok = jawaban[i] === d.benar;
        const jwbSiswa = jawaban[i] === undefined ? 'Tidak dijawab' : `${huruf[jawaban[i]]}. ${esc(d.opsi[jawaban[i]])}`;
        return `<div class="review ${ok ? 'benar' : 'salah'}">
            <b>${i + 1}. ${ok ? 'Benar' : 'Belum tepat'}</b>
            <p>${esc(d.q)}</p>
            <p><b>Jawabanmu:</b> ${jwbSiswa}<br><b>Jawaban benar:</b> ${huruf[d.benar]}. ${esc(d.opsi[d.benar])}</p>
            <details ${ok ? '' : 'open'}><summary>Lihat penjelasan</summary>${ulas(d, jawaban[i])}</details>
        </div>`;
    }).join('');

    document.getElementById('main').innerHTML = `
        <div class="topbar">
            <a href="dashboard.html" class="dashboard-btn">Kembali</a>
            <div class="badge">Latihan selesai</div>
        </div>
        <h2 style="color:#0369a1;">Hasil Latihan Soal PLSV</h2>
        <div class="skor-besar">${nilai}</div>
        <p style="margin-bottom:14px;">Kamu menjawab benar ${skor} dari ${soal.length} soal.</p>
        <p style="margin-bottom:12px;color:#64748b;">Buka penjelasan di tiap soal untuk melihat kenapa jawabanmu benar atau salah. Tekan "Latihan Lagi" untuk mendapat 10 soal baru.</p>
        ${review}
        <div class="footer"><span></span><button class="next" onclick="location.reload()">Latihan Lagi</button></div>`;
    document.getElementById('main').scrollTop = 0;
}

init();
</script>
